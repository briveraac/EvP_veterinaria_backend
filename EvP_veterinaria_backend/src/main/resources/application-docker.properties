# Perfil "docker": usa PostgreSQL en vez de H2.
# La URL, usuario y clave llegan por variables de entorno desde docker-compose.yml.
spring.datasource.driverClassName=org.postgresql.Driver

# update: conserva los datos entre reinicios (la BD vive en un volumen de Docker)
spring.jpa.hibernate.ddl-auto=update

# Con una BD que no es embebida hay que pedir explicitamente que se ejecute el script
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-postgres.sql

# La consola H2 no aplica con PostgreSQL
spring.h2.console.enabled=false
