spring.application.name=backend
server.port=8080

# Base de datos H2 en memoria (se borra al detener el servidor)
spring.datasource.url=jdbc:h2:mem:veterinaria
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA crea la tabla a partir de la clase Cita
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Carga data.sql despues de crear las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8

# Consola web de H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
