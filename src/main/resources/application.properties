spring.application.name=backend
server.port=8080

# Base de datos H2 en memoria (se borra al detener el servidor)
spring.datasource.url=jdbc:h2:mem:veterinaria
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA crea las tablas a partir de las clases Cita y Usuario
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Carga data.sql despues de crear las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8

# Consola web de H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# JWT: clave para firmar los tokens y cuanto duran.
# ${JWT_SECRETO:...} = usa la variable de entorno JWT_SECRETO y, si no existe, el valor por defecto.
# En AWS/produccion hay que poner una clave propia en la variable de entorno.
jwt.secreto=${JWT_SECRETO:clave-de-desarrollo-veterinaria-san-marcos-2026}
jwt.duracion-minutos=60

# CORS: desde donde se puede llamar a la API (separados por coma).
# Vite usa 5173 en desarrollo y 4173 con "npm run preview". El tercero es GitHub Pages.
cors.origenes=${CORS_ORIGENES:http://localhost:5173,http://localhost:4173,https://briveraac.github.io}
