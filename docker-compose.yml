services:
  db:
    image: postgres:16
    container_name: veterinaria-db
    environment:
      POSTGRES_DB: veterinaria
      POSTGRES_USER: vet
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vet123}
    # No publicamos el puerto 5432: el backend llega a la BD por la red interna de Docker.
    # Si quieres verla con pgAdmin en tu PC, descomenta estas dos lineas:
    # ports:
    #   - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vet -d veterinaria"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: veterinaria-backend
    ports:
      - "8080:8080"
    environment:
      # Activa application-docker.properties (PostgreSQL)
      SPRING_PROFILES_ACTIVE: docker
      # Dentro de Docker la BD se llama "db" (nombre del servicio), no localhost
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/veterinaria
      SPRING_DATASOURCE_USERNAME: vet
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-vet123}
      # Clave para firmar los JWT. En AWS se cambia en un archivo .env (ver README).
      JWT_SECRETO: ${JWT_SECRETO:-clave-de-desarrollo-veterinaria-san-marcos-2026}
      # Origenes permitidos por CORS. En AWS se agrega http://IP_PUBLICA
      CORS_ORIGENES: ${CORS_ORIGENES:-http://localhost:5173,http://localhost:4173,https://briveraac.github.io}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
